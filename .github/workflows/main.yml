name: Build Dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 也支持手动触发（可选）
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER /opt/theos

      - name: Install ldid (optional)
        run: brew install ldid || true

      - name: Build
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export CODESIGN=NO   # 强制跳过签名，避免 ldid 缺失错误
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick.dylib
          path: .theos/obj/*.dylib
